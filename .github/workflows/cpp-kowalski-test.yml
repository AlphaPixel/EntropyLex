name: cpp-kowalski-test

on:
  push:
    branches: [main]
    paths: ['src/cpp/kowalski/**']
  pull_request:
    branches: ['**']
    paths: ['src/cpp/kowalski/**']

jobs:
  cpp-kowalski-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cpp/kowalski

    steps:
    - name: checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0


    - name: Setup Cpp
      uses: aminya/setup-cpp@v1
      with:
        compiler: llvm
        vcvarsall: true
        cmake: true
        ninja: true
        vcpkg: true

    - name: build and test
      run: |
        cmake -S . -B ./build
        cmake --build ./build
        ctest --test-dir ./build --output-on-failure
