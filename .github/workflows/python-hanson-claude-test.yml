name: python-hanson-claude-test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  python-hanson-claude-test:
    strategy:
      matrix:
        python: [ '3.13' ]

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/python/hanson-claude

    steps:
    - name: checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: setup python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
        cache: pip
        cache-dependency-path: src/python/hanson-claude/requirements-dev.txt

    - name: install project and development tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install --editable . --requirement requirements-dev.txt

    - name: lint
      run: |
        make lint

    - name: test
      run: |
        make test
